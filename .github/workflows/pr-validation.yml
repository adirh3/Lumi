name: PR Build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      experiment:
        description: Diagnostic experiment (diagnostic branch only)
        type: choice
        default: startup
        options: [startup, framework-versions]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  framework-version-probe:
    if: github.ref_name == 'diagnostics/macos-idle-87c79f2d' && inputs.experiment == 'framework-versions'
    name: Avalonia version comparison (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    defaults:
      run:
        shell: pwsh
    env:
      LUMI_IDLE_CPU_SAMPLE_COUNT: '5'
      LUMI_IDLE_CPU_SAMPLE_SECONDS: '5'
      LUMI_IDLE_CPU_SETTLE_SECONDS: '5'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview
      - name: Build with released Avalonia version
        run: dotnet build src/Lumi/Lumi.csproj -c Debug -p:PublishTrimmed=false -p:AvaloniaVersion=12.1.0 --nologo -v quiet
      - name: Measure bare Avalonia 12.1.0
        run: ./tools/Invoke-IdleCpuProbe.ps1 -Variant bare-12.1.0 -Bare -ExpectedAvaloniaVersion 12.1.0
      - name: Measure Lumi with Avalonia 12.1.0
        if: ${{ !cancelled() }}
        run: ./tools/Invoke-IdleCpuProbe.ps1 -Variant lumi-12.1.0 -ExpectedAvaloniaVersion 12.1.0
      - name: Build identical code with current Avalonia version
        if: ${{ !cancelled() }}
        run: dotnet build src/Lumi/Lumi.csproj -c Debug -p:PublishTrimmed=false -p:AvaloniaVersion=12.1.2 --nologo -v quiet
      - name: Measure bare Avalonia 12.1.2
        if: ${{ !cancelled() }}
        run: ./tools/Invoke-IdleCpuProbe.ps1 -Variant bare-12.1.2 -Bare -ExpectedAvaloniaVersion 12.1.2
      - name: Measure Lumi with Avalonia 12.1.2
        if: ${{ !cancelled() }}
        run: ./tools/Invoke-IdleCpuProbe.ps1 -Variant lumi-12.1.2 -ExpectedAvaloniaVersion 12.1.2
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: avalonia-versions-${{ matrix.os }}
          path: IdleProbeResults
          if-no-files-found: warn
          retention-days: 3

  idle-probe:
    if: github.ref_name == 'diagnostics/macos-idle-87c79f2d' && inputs.experiment != 'framework-versions'
    name: Native idle probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, windows-latest]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview
      - name: Record native display environment
        if: runner.os == 'macOS'
        run: |
          New-Item -ItemType Directory -Path IdleProbeResults -Force | Out-Null
          system_profiler SPDisplaysDataType | Set-Content IdleProbeResults/display.txt
          sw_vers | Set-Content IdleProbeResults/os.txt
      - name: Build original Lumi
        run: dotnet build src/Lumi/Lumi.csproj -c Debug -p:PublishTrimmed=false --nologo -v quiet
      - name: Measure bare Avalonia native startup
        run: ./tools/Invoke-IdleCpuProbe.ps1 -Variant bare-default -Bare
      - name: Measure original Lumi native startup
        if: ${{ !cancelled() }}
        run: ./tools/Invoke-IdleCpuProbe.ps1 -Variant lumi-default
      - name: Measure software fallback
        if: ${{ !cancelled() }}
        run: ./tools/Invoke-IdleCpuProbe.ps1 -Variant lumi-software -Renderer software
      - name: Apply isolated animation-fix comparison
        if: ${{ !cancelled() }}
        run: |
          git -C Strata apply ../tools/idle-animation-strata.patch
          if ($LASTEXITCODE -ne 0) { throw 'Strata comparison patch failed.' }
          git apply tools/idle-animation-lumi.patch
          if ($LASTEXITCODE -ne 0) { throw 'Lumi comparison patch failed.' }
          dotnet build src/Lumi/Lumi.csproj -c Debug -p:PublishTrimmed=false --nologo -v quiet
          if ($LASTEXITCODE -ne 0) { throw 'Patched Lumi build failed.' }
      - name: Measure Lumi with animation fixes
        if: ${{ !cancelled() }}
        run: ./tools/Invoke-IdleCpuProbe.ps1 -Variant lumi-optimized
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: native-idle-${{ matrix.os }}
          path: IdleProbeResults
          if-no-files-found: warn
          retention-days: 3

  validate:
    if: github.ref_name != 'diagnostics/macos-idle-87c79f2d'
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows is the primary/shipping platform: full build + test suite.
          - os: windows-latest
          # Linux and macOS build the full solution and run the platform-sensitive subset.
          # The remaining suite still contains Windows-only host and animation assumptions.
          - os: ubuntu-latest
          - os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview

      - name: Restore
        run: dotnet restore Lumi.slnx

      - name: Build
        run: dotnet build Lumi.slnx --configuration Release --no-restore

      - name: Test (desktop Windows suite in fresh-host batches)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: >
          ./tools/Test-LumiTestsInBatches.ps1
          -Configuration Release
          -ResultsDirectory TestResults

      - name: Test (mobile Windows suite)
        if: ${{ runner.os == 'Windows' }}
        run: >
          dotnet test tests/Lumi.Mobile.Tests/Lumi.Mobile.Tests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=lumi-mobile.trx"
          --results-directory TestResults

      - name: Test (cross-platform runtime behavior)
        if: ${{ runner.os != 'Windows' }}
        run: >
          dotnet test tests/Lumi.Tests/Lumi.Tests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults
          --filter
          "(FullyQualifiedName~Lumi.Tests.UnixShellPathTests
          |FullyQualifiedName~Lumi.Tests.McpProxyRuntimeTests.Proxy_ResolvesPathCommandBeforeStartingStdioServer_OnUnix
          |FullyQualifiedName~Lumi.Tests.SystemPromptBuilderTests
          |FullyQualifiedName~Lumi.Tests.AgentsViewModelToolSelectionTests
          |FullyQualifiedName~Lumi.Tests.ChatViewModelAgentRoutingTests
          |FullyQualifiedName~Lumi.Tests.RebaseAttachmentPathsTests
          |FullyQualifiedName~Lumi.Tests.ToolDisplayHelperTests
          |FullyQualifiedName~Lumi.Tests.BrowserServiceLifecycleTests
          |FullyQualifiedName~Lumi.Tests.DataStorePlatformSkillMigrationTests
          |FullyQualifiedName~Lumi.Tests.LocKeyboardHintTests
          |FullyQualifiedName~Lumi.Tests.SingleInstanceCoordinatorTests
          |FullyQualifiedName~Lumi.Tests.UpdateServiceSafetyTests.UpdateChannel_)"

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          if-no-files-found: ignore

  validate-strata:
    if: github.ref_name != 'diagnostics/macos-idle-87c79f2d'
    name: Validate Strata
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview

      - name: Test Strata (net8.0)
        run: >
          dotnet test Strata/tests/StrataTheme.Tests/StrataTheme.Tests.csproj
          --configuration Release
          --framework net8.0

      - name: Test Strata (net11.0)
        run: >
          dotnet test Strata/tests/StrataTheme.Tests/StrataTheme.Tests.csproj
          --configuration Release
          --framework net11.0

  validate-android:
    if: github.ref_name != 'diagnostics/macos-idle-87c79f2d'
    name: Validate Android APK
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Install Android SDK dependencies
        shell: pwsh
        run: >
          dotnet build src/Lumi.Mobile.Android/Lumi.Mobile.Android.csproj
          -t:InstallAndroidDependencies
          -f net10.0-android
          -p:AndroidSdkDirectory="$env:ANDROID_HOME"
          -p:JavaSdkDirectory="$env:JAVA_HOME"
          -p:AcceptAndroidSDKLicenses=True

      - name: Build Android Debug APK
        shell: pwsh
        run: >
          dotnet build src/Lumi.Mobile.Android/Lumi.Mobile.Android.csproj
          -c Debug
          -f net10.0-android
          -r android-arm64
          -p:AndroidSdkDirectory="$env:ANDROID_HOME"
          -p:JavaSdkDirectory="$env:JAVA_HOME"

      - name: Upload Android validation APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-${{ github.sha }}
          path: src/Lumi.Mobile.Android/bin/Debug/net10.0-android/**/*-Signed.apk
          if-no-files-found: error
          retention-days: 7

  validate-browser:
    if: github.ref_name != 'diagnostics/macos-idle-87c79f2d'
    name: Validate Avalonia PWA
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview

      - name: Install .NET 10 WebAssembly workload
        run: dotnet workload install wasm-tools-net10

      - name: Publish browser PWA
        run: >
          dotnet publish src/Lumi.Mobile.Browser/Lumi.Mobile.Browser.csproj
          --configuration Release
          --output BrowserPublish

      - name: Verify browser PWA output
        shell: pwsh
        run: |
          $root = "BrowserPublish/wwwroot"
          $required = @(
            "$root/index.html",
            "$root/android.html",
            "$root/android-install.css",
            "$root/android-install.js",
            "$root/manifest.webmanifest",
            "$root/_framework/dotnet.js"
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            throw "Browser publish is missing: $($missing -join ', ')"
          }
          $redundant = @(Get-ChildItem $root -Recurse -File | Where-Object {
            $_.Name -like "*.gz" -or $_.Name -match "\.map(?:\.(?:br|gz))?$"
          })
          if ($redundant.Count -gt 0) {
            throw "Browser publish contains redundant release assets: $($redundant.FullName -join ', ')"
          }
          if (-not (Get-ChildItem $root -Recurse -File -Filter "*.br" | Select-Object -First 1)) {
            throw "Browser publish is missing Brotli assets."
          }
          $installerScript = Get-Content "$root/android-install.js" -Raw
          if ($installerScript -notmatch 'package=com\.lumi\.mobile' -or
              $installerScript -match "parameters\.get\(['`"]apk") {
            throw "Android installer must use the package-scoped official release flow."
          }

      - name: Upload browser validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: browser-pwa-${{ github.sha }}
          path: BrowserPublish/wwwroot
          if-no-files-found: error
          retention-days: 7

  validate-required:
    name: Validate
    if: ${{ always() && github.ref_name != 'diagnostics/macos-idle-87c79f2d' }}
    needs: [validate, validate-strata, validate-android, validate-browser]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required validation jobs
        env:
          PLATFORM_RESULT: ${{ needs.validate.result }}
          STRATA_RESULT: ${{ needs.validate-strata.result }}
          ANDROID_RESULT: ${{ needs.validate-android.result }}
          BROWSER_RESULT: ${{ needs.validate-browser.result }}
        run: |
          if [[ "$PLATFORM_RESULT" != "success" ||
                "$STRATA_RESULT" != "success" ||
                "$ANDROID_RESULT" != "success" ||
                "$BROWSER_RESULT" != "success" ]]; then
            echo "Validation failed: platform=$PLATFORM_RESULT strata=$STRATA_RESULT android=$ANDROID_RESULT browser=$BROWSER_RESULT"
            exit 1
          fi
