name: PR Build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_suite:
        description: 'Also run the extended Windows desktop and mobile suites'
        type: boolean
        default: false
  schedule:
    - cron: '15 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Nightly/full Windows batches can take about half an hour.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every desktop shipping architecture runs the deterministic CoreQA gate.
          - os: windows-latest
            architecture: x64
          - os: windows-11-arm
            architecture: arm64
          - os: ubuntu-latest
            architecture: x64
          - os: ubuntu-24.04-arm
            architecture: arm64
          - os: macos-15
            architecture: arm64
          - os: macos-15-intel
            architecture: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview

      - name: Verify native runner architecture
        shell: pwsh
        run: |
          $architecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().ToLowerInvariant()
          if ($architecture -ne "${{ matrix.architecture }}") {
            throw "Expected ${{ matrix.architecture }}, got $architecture."
          }
          $sdkRid = dotnet msbuild src/Lumi/Lumi.csproj -nologo -getProperty:NETCoreSdkPortableRuntimeIdentifier | Select-Object -Last 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($sdkRid -ne "${{ runner.os == 'Windows' && 'win' || runner.os == 'macOS' && 'osx' || 'linux' }}-${{ matrix.architecture }}") {
            throw "The .NET SDK is not native to this runner: $sdkRid."
          }

      - name: Restore
        run: dotnet restore Lumi.slnx

      - name: Build
        run: dotnet build Lumi.slnx --configuration Release --no-restore

      - name: Test (desktop Windows suite in fresh-host batches)
        if: ${{ runner.os == 'Windows' && (github.event_name == 'schedule' || inputs.full_suite == true) }}
        shell: pwsh
        run: >
          ./tools/Test-LumiTestsInBatches.ps1
          -Configuration Release
          -ResultsDirectory TestResults

      - name: Test (mobile Windows suite)
        if: ${{ runner.os == 'Windows' && (github.event_name == 'schedule' || inputs.full_suite == true) }}
        run: >
          dotnet test tests/Lumi.Mobile.Tests/Lumi.Mobile.Tests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=lumi-mobile.trx"
          --results-directory TestResults

      - name: Test (deterministic desktop and mobile QA)
        shell: pwsh
        run: >
          ./tools/Test-LumiQa.ps1
          -Suite Core
          -Configuration Release
          -NoBuild
          -ResultsDirectory QaResults

      - name: Test (native desktop packaging and update channels)
        run: >
          dotnet test tests/Lumi.Tests/Lumi.Tests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=packaging.trx"
          --results-directory TestResults
          --filter
          "(FullyQualifiedName~Lumi.Tests.CopilotPackagingTests
          |FullyQualifiedName~Lumi.Tests.VoiceInputPackagingTests
          |FullyQualifiedName~Lumi.Tests.UpdateServiceSafetyTests.UpdateChannel_)"

      - name: Test (cross-platform runtime behavior)
        if: ${{ runner.os != 'Windows' }}
        run: >
          dotnet test tests/Lumi.Tests/Lumi.Tests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults
          --filter
          "(FullyQualifiedName~Lumi.Tests.UnixShellPathTests
          |FullyQualifiedName~Lumi.Tests.AppIconTests
          |FullyQualifiedName~Lumi.Tests.McpProxyRuntimeTests.Proxy_ResolvesPathCommandBeforeStartingStdioServer_OnUnix
          |FullyQualifiedName~Lumi.Tests.SystemPromptBuilderTests
          |FullyQualifiedName~Lumi.Tests.AgentsViewModelToolSelectionTests
          |FullyQualifiedName~Lumi.Tests.ChatViewModelAgentRoutingTests
          |FullyQualifiedName~Lumi.Tests.RebaseAttachmentPathsTests
          |FullyQualifiedName~Lumi.Tests.ToolDisplayHelperTests
          |FullyQualifiedName~Lumi.Tests.BrowserServiceLifecycleTests
          |FullyQualifiedName~Lumi.Tests.DataStorePlatformSkillMigrationTests
          |FullyQualifiedName~Lumi.Tests.LocKeyboardHintTests
          |FullyQualifiedName~Lumi.Tests.Voice
          |FullyQualifiedName~Lumi.Tests.SingleInstanceCoordinatorTests
          |FullyQualifiedName~Lumi.Tests.UpdateServiceSafetyTests.UpdateChannel_)"

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            TestResults
            QaResults/**/summary.json
            QaResults/**/desktop/*
            QaResults/**/mobile/*
          if-no-files-found: error

  validate-strata:
    name: Validate Strata
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview

      - name: Test Strata (net8.0)
        run: >
          dotnet test Strata/tests/StrataTheme.Tests/StrataTheme.Tests.csproj
          --configuration Release
          --framework net8.0

      - name: Test Strata (net11.0)
        run: >
          dotnet test Strata/tests/StrataTheme.Tests/StrataTheme.Tests.csproj
          --configuration Release
          --framework net11.0

  validate-android:
    name: Validate Android APK
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Install Android SDK dependencies
        shell: pwsh
        run: >
          dotnet build src/Lumi.Mobile.Android/Lumi.Mobile.Android.csproj
          -t:InstallAndroidDependencies
          -f net10.0-android
          -p:AndroidSdkDirectory="$env:ANDROID_HOME"
          -p:JavaSdkDirectory="$env:JAVA_HOME"
          -p:AcceptAndroidSDKLicenses=True

      - name: Build Android Debug APK
        shell: pwsh
        run: >
          dotnet build src/Lumi.Mobile.Android/Lumi.Mobile.Android.csproj
          -c Debug
          -f net10.0-android
          -r android-arm64
          -p:AndroidSdkDirectory="$env:ANDROID_HOME"
          -p:JavaSdkDirectory="$env:JAVA_HOME"

      - name: Upload Android validation APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-${{ github.sha }}
          path: src/Lumi.Mobile.Android/bin/Debug/net10.0-android/**/*-Signed.apk
          if-no-files-found: error
          retention-days: 7

  validate-browser:
    name: Validate Avalonia PWA
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview

      - name: Install .NET 10 WebAssembly workload
        run: dotnet workload install wasm-tools-net10

      - name: Publish browser PWA
        run: >
          dotnet publish src/Lumi.Mobile.Browser/Lumi.Mobile.Browser.csproj
          --configuration Release
          --output BrowserPublish

      - name: Verify browser PWA output
        shell: pwsh
        run: |
          $root = "BrowserPublish/wwwroot"
          $required = @(
            "$root/index.html",
            "$root/android.html",
            "$root/android-install.css",
            "$root/android-install.js",
            "$root/manifest.webmanifest",
            "$root/service-worker.js",
            "$root/service-worker-assets.js",
            "$root/pwaHost.js",
            "$root/workerFrames.js",
            "$root/workerFramePresenter.js",
            "$root/_framework/dotnet.js"
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            throw "Browser publish is missing: $($missing -join ', ')"
          }
          $redundant = @(Get-ChildItem $root -Recurse -File | Where-Object {
            $_.Name -like "*.gz" -or $_.Name -match "\.map(?:\.(?:br|gz))?$"
          })
          if ($redundant.Count -gt 0) {
            throw "Browser publish contains redundant release assets: $($redundant.FullName -join ', ')"
          }
          if (-not (Get-ChildItem $root -Recurse -File -Filter "*.br" | Select-Object -First 1)) {
            throw "Browser publish is missing Brotli assets."
          }
          $installerScript = Get-Content "$root/android-install.js" -Raw
          if ($installerScript -notmatch 'package=com\.lumi\.mobile' -or
              $installerScript -match "parameters\.get\(['`"]apk") {
            throw "Android installer must use the package-scoped official release flow."
          }

      - name: Test PWA caching, lifecycle and worker rendering
        env:
          LUMI_PWA_PUBLISH_ROOT: BrowserPublish\wwwroot
        run: node --test tests/Lumi.Mobile.Tests/PwaHostTests.mjs tests/Lumi.Mobile.Tests/WorkerFramesTests.mjs tests/Lumi.Mobile.Tests/BrowserRecovery.test.mjs

      - name: Upload browser validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: browser-pwa-${{ github.sha }}
          path: BrowserPublish/wwwroot
          if-no-files-found: error
          retention-days: 7

  validate-required:
    name: Validate
    if: ${{ always() }}
    needs: [validate, validate-strata, validate-android, validate-browser]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required validation jobs
        env:
          PLATFORM_RESULT: ${{ needs.validate.result }}
          STRATA_RESULT: ${{ needs.validate-strata.result }}
          ANDROID_RESULT: ${{ needs.validate-android.result }}
          BROWSER_RESULT: ${{ needs.validate-browser.result }}
        run: |
          if [[ "$PLATFORM_RESULT" != "success" ||
                "$STRATA_RESULT" != "success" ||
                "$ANDROID_RESULT" != "success" ||
                "$BROWSER_RESULT" != "success" ]]; then
            echo "Validation failed: platform=$PLATFORM_RESULT strata=$STRATA_RESULT android=$ANDROID_RESULT browser=$BROWSER_RESULT"
            exit 1
          fi
