name: PR Build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows is the primary/shipping platform: full build + test suite.
          - os: windows-latest
          # Linux and macOS build the full solution and run the platform-sensitive subset.
          # The remaining suite still contains Windows-only host and animation assumptions.
          - os: ubuntu-latest
          - os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview

      - name: Restore
        run: dotnet restore Lumi.slnx

      - name: Build
        run: dotnet build Lumi.slnx --configuration Release --no-restore

      - name: Test (desktop Windows suite in fresh-host batches)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: >
          ./tools/Test-LumiTestsInBatches.ps1
          -Configuration Release
          -ResultsDirectory TestResults

      - name: Test (mobile Windows suite)
        if: ${{ runner.os == 'Windows' }}
        run: >
          dotnet test tests/Lumi.Mobile.Tests/Lumi.Mobile.Tests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=lumi-mobile.trx"
          --results-directory TestResults

      - name: Test (cross-platform runtime behavior)
        if: ${{ runner.os != 'Windows' }}
        run: >
          dotnet test tests/Lumi.Tests/Lumi.Tests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults
          --filter
          "(FullyQualifiedName~Lumi.Tests.UnixShellPathTests
          |FullyQualifiedName~Lumi.Tests.McpProxyRuntimeTests.Proxy_ResolvesPathCommandBeforeStartingStdioServer_OnUnix
          |FullyQualifiedName~Lumi.Tests.SystemPromptBuilderTests
          |FullyQualifiedName~Lumi.Tests.AgentsViewModelToolSelectionTests
          |FullyQualifiedName~Lumi.Tests.ChatViewModelAgentRoutingTests
          |FullyQualifiedName~Lumi.Tests.RebaseAttachmentPathsTests
          |FullyQualifiedName~Lumi.Tests.ToolDisplayHelperTests
          |FullyQualifiedName~Lumi.Tests.BrowserServiceLifecycleTests
          |FullyQualifiedName~Lumi.Tests.DataStorePlatformSkillMigrationTests
          |FullyQualifiedName~Lumi.Tests.LocKeyboardHintTests
          |FullyQualifiedName~Lumi.Tests.UpdateServiceSafetyTests.UpdateChannel_)"

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          if-no-files-found: ignore

  validate-strata:
    name: Validate Strata
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview

      - name: Test Strata (net8.0)
        run: >
          dotnet test Strata/tests/StrataTheme.Tests/StrataTheme.Tests.csproj
          --configuration Release
          --framework net8.0

      - name: Test Strata (net11.0)
        run: >
          dotnet test Strata/tests/StrataTheme.Tests/StrataTheme.Tests.csproj
          --configuration Release
          --framework net11.0

  validate-android:
    name: Validate Android APK
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Install Android SDK dependencies
        shell: pwsh
        run: >
          dotnet build src/Lumi.Mobile.Android/Lumi.Mobile.Android.csproj
          -t:InstallAndroidDependencies
          -f net11.0-android
          -p:AndroidSdkDirectory="$env:ANDROID_HOME"
          -p:JavaSdkDirectory="$env:JAVA_HOME"
          -p:AcceptAndroidSDKLicenses=True

      - name: Build Android Debug APK
        shell: pwsh
        run: >
          dotnet build src/Lumi.Mobile.Android/Lumi.Mobile.Android.csproj
          -c Debug
          -f net11.0-android
          -r android-arm64
          -p:AndroidSdkDirectory="$env:ANDROID_HOME"
          -p:JavaSdkDirectory="$env:JAVA_HOME"

      - name: Upload Android validation APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-${{ github.sha }}
          path: src/Lumi.Mobile.Android/bin/Debug/net11.0-android/**/*-Signed.apk
          if-no-files-found: error
          retention-days: 7
