<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#111114">
  <meta name="application-name" content="Lumi">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lumi">
  <title>Lumi</title>
  <link rel="manifest" href="./manifest.webmanifest" crossorigin="use-credentials">
  <link rel="icon" href="./icons/lumi-192.png">
  <link rel="apple-touch-icon" href="./icons/lumi-192.png">
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <div id="out">
    <div class="lumi-splash avalonia-splash">
      <img src="./icons/lumi-192.png" alt="">
      <strong>Lumi</strong>
      <span role="status" data-lumi-string="WebOpening">Opening Lumi...</span>
      <button id="startup-retry" type="button" data-lumi-string="TryAgain" hidden>Try again</button>
    </div>
  </div>
  <dialog id="lumi-recovery" class="lumi-recovery" role="alertdialog"
          aria-labelledby="lumi-recovery-title" aria-describedby="lumi-recovery-message" hidden>
    <div>
      <h1 id="lumi-recovery-title" data-lumi-string="WebNeedsReload">Lumi needs to reload</h1>
      <p id="lumi-recovery-message"></p>
      <button id="lumi-reload" type="button" data-lumi-string="WebReload">Reload Lumi</button>
      <p class="lumi-recovery-note" data-lumi-string="WebReloadNote">Saved chats stay on your computer. Reloading may discard unsent text.</p>
    </div>
  </dialog>
  <script src="./localization.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
