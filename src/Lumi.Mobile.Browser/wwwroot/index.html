<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111114">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lumi">
  <title>Lumi</title>
  <link rel="manifest" href="./manifest.webmanifest" crossorigin="use-credentials">
  <link rel="icon" href="./icons/lumi-192.png">
  <link rel="apple-touch-icon" href="./icons/lumi-192.png">
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <div id="out">
    <div class="lumi-splash avalonia-splash">
      <img src="./icons/lumi-192.png" alt="">
      <strong>Lumi</strong>
      <span>Connecting to your PC...</span>
    </div>
  </div>
  <section id="lumi-recovery" class="lumi-recovery" role="alert"
           aria-labelledby="lumi-recovery-title" hidden>
    <div>
      <h1 id="lumi-recovery-title">Lumi needs to reload</h1>
      <p id="lumi-recovery-message"></p>
      <button id="lumi-reload" type="button">Reload Lumi</button>
      <p class="lumi-recovery-note">Saved chats stay on your PC. Reloading may discard unsent text.</p>
    </div>
  </section>
  <script type="module" src="./main.js"></script>
</body>
</html>
